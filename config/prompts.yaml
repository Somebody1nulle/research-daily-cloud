# 调研工作流云端版 · 提示词配置
# 所有发给 Kimi 的提示词集中在此，调整风格/规则只改这里

# ---------- 定向搜索（每日调研） ----------
research:
  # {subtopic} 会被看板当前小专题替换；{task} 会被看板当日任务替换
  text_queries:
    - "{subtopic} 原理 科普 深度"
    - "{subtopic} 是什么 通俗 解释"
    - "{subtopic} 行业分析 报告 2026"
    - "{subtopic} 企业 产品 应用"
  av_queries:
    - "{subtopic} 讲座 视频"
    - "{subtopic} 演讲 视频 科普"
    - "{subtopic} site:bilibili.com"
    - "{subtopic} site:youtube.com 讲解"

  select_prompt: |
    你是调研助手，为一位【产品经理】筛选学习材料（不要高深数学/论文推导，要概念、原理、直觉类比、行业逻辑，小白能看懂并复述）。
    今日小专题：{subtopic}
    当日任务：{task}
    下面是搜索到的候选条目（JSON 数组，含 title/url/snippet/type_hint）：
    {candidates}

    请从中挑选：
    1. 文字稿 {n_text} 篇（官方科普博客/深度科普文/行业分析报告优先，剔除纯新闻短稿）
    2. 音视频 {n_av} 份（讲座/发布会/深度对谈/视频科普优先）

    对每条给出：
    - title: 中文标题（可润色，保留原意）
    - url: 原链接（必须原样保留）
    - summary: 一句话概述（2句以内，只讲方向和价值）
    - material_type: 文章/报告/视频/播客 四选一
    - duration: 预估时长，四选一：<15min / 15-30min / 30-60min / >1h（文字按400字/分钟估，音视频按类型估：讲座/发布会通常30-60min+，新闻短片<15min）
    - candidate: true/false，是否为精读候选（挑最有深度价值的，全天上限 {n_cand} 个）

    严格输出 JSON：{{"texts": [...], "avs": [...]}}，不要输出任何其他文字。

# ---------- 每日热点 ----------
hotspot:
  # {domain} 会被领域名替换；{window} 会被日期窗口替换（如 8月6日至8月10日）
  query_template: "{domain} 新闻 {date_kw}"

  select_prompt: |
    你是行业热点编辑。请为五个领域挑选今日热点，覆盖时间窗：{window}。
    候选条目（JSON 数组，含 domain/title/url/snippet）：
    {candidates}

    规则：
    1. 最终输出共 {n_hot} 条，五个领域（科技综合/AI大模型/机器人/智能汽车·AI CAR/智能硬件）各约 1 条
    2. 优先有行业影响力的事件（产品发布、融资、政策、技术突破），忽略花边和传闻
    3. 去重审查：主题高度重叠、来自同一篇报道（同链接）、讲同一件事的两个数据面的条目，合并成一条，宁缺毋滥
    4. 发布日期必须落在时间窗内，明显超出窗口的剔除
    5. 每条给出：
       - domain: 领域（必须与输入完全一致）
       - title: 中文标题
       - url: 链接
       - summary: 一句话概述
       - candidate_topic: 若符合以下三条则给出「选题名称+理由1句」，否则给空字符串""
         ①涉及行业结构性变化而非单一事件；②有持续性，未来一个月还会有进展；③与「世界模型与物理AI」主题相关

    严格输出 JSON 对象 {{"items": [...]}}（items 为热点数组），不要输出任何其他文字。
