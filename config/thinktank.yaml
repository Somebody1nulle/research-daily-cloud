    type: "rss"
    feed_url: "https://www.wilsoncenter.org/rss.xml"
    feed_candidates:
      - "https://www.wilsoncenter.org/feed"
      - "https://www.wilsoncenter.org/articles/rss.xml"
      - "https://www.wilsoncenter.org/rss"
  - name: "CSIS"
    type: "rss"
    feed_url: "https://www.csis.org/rss.xml"
  - name: "Brookings"
    type: "rss"
    feed_url: "https://www.brookings.edu/feed/"
    feed_candidates:
      - "https://www.brookings.edu/feed"
      - "https://www.brookings.edu/rss.xml"
      - "https://www.brookings.edu/articles/feed/"
  - name: "CFR"
