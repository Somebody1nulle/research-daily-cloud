# 每日智库 · 信源与规则配置
# 8家英文政策智库。RSS 失效时把 type 改为 scrape 并补 list_url。

tables:
  main: "tblbOz8rraghdbNZ"      # 每日智库（只放当天）
  archive: "tblrJr4EU1WUkfMO"   # 每日智库归档

# 抓取窗口：前一天 00:00 ~ 今天 09:00（北京时间）
window:
  end_hour: 9

topics: ["中美经贸", "科技竞争", "宏观经济", "货币政策", "地缘政治", "能源与气候", "其他"]

# 相关度评分规则（写进 LLM 提示词）
relevance_rules: "与中美经贸/科技竞争/宏观经济直接相关=4-5，间接相关=3，其他=1-2"

sources:
  - name: "Wilson Center"
    type: "scrape"
    list_url: "https://www.wilsoncenter.org/insight-analysis"
    path_include: "/article/"
    note: "洞察分析页的文章详情链接是 /article/xxx（调试发现）"
  - name: "Economic Club of Washington"
    type: "scrape"
    list_url: "https://www.economicclub.org/past-events"
    path_include: "/events/"
    note: "past-events 页的活动详情链接是 /events/xxx（调试发现）"
  - name: "CSIS"
    type: "scrape"
    list_url: "https://www.csis.org/analysis"
    path_include: "/analysis/"
    note: "rss.xml 内容停留在3月（废弃），改抓分析列表页"
  - name: "Brookings"
    type: "scrape"
    list_url: "https://www.brookings.edu/articles/"
    path_include: "/articles/"
    note: "feed 返回162KB HTML（反爬），改抓文章列表页试试"
  - name: "CFR"
    type: "rss"
    feed_url: "https://www.cfr.org/feed"
    note: "主 feed 404，/feed 可用（已验证）"
  - name: "Asia Society"
    type: "scrape"
    list_url: "https://asiasociety.org/blog"
    path_include: "/blog/"
    note: "/feed 返回215KB HTML 非feed，改抓博客列表页"
  - name: "MERICS"
    type: "rss"
    feed_url: "https://merics.org/en/rss"
    note: "可用（已验证）；8月为欧洲夏休无更新属正常"
  - name: "Bridgewater"
    type: "scrape"
    list_url: "https://www.bridgewater.com/research-and-insights"
    path_include: "/research-and-insights/"
    article_dated: true   # 列表卡片无日期，进文章页取发布日期
    note: "无公开RSS；列表页无日期（调试验证），走文章页取日期"
